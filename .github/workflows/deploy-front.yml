name: Deploy Frontend to AWS

on:
  push:
    branches: [ main ] # Se activa cuando subes cambios a main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/front-web:latest ./front_despacho
          docker push ${{ secrets.DOCKER_USERNAME }}/front-web:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_FRONTEND_IP }}
          username: ec2-user # O 'ubuntu' dependiendo de tu instancia
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/front-web:latest
            sudo docker rm -f front_innovatech || true
            sudo docker run -d --name front_innovatech -p 80:80 ${{ secrets.DOCKER_USERNAME }}/front-web:latest