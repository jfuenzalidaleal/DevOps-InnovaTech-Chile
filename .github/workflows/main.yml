name: Deploy Frontend to AWS

on:
  push:
    branches: [ main ] # Se activa al subir cambios a la rama main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # Construimos la imagen apuntando a la carpeta del frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/front-web:latest ./front_despacho
          docker push ${{ secrets.DOCKER_USERNAME }}/front-web:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_FRONTEND_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Autenticarse en Docker (opcional si la imagen es pública, pero recomendado)
            # 2. Bajar la última versión de la imagen
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/front-web:latest
            
            # 3. Detener el contenedor actual si existe
            sudo docker stop front_innovatech || true
            sudo docker rm -f front_innovatech || true
            
            # 4. Correr el nuevo contenedor
            sudo docker run -d --name front_innovatech -p 80:80 ${{ secrets.DOCKER_USERNAME }}/front-web:latest
            
            # 5. Limpiar imágenes antiguas para no llenar el disco de la EC2
            sudo docker image prune -f