name: CI/CD Innovatech Pipeline

on:
  push:
    branches: [ "main", "deploy" ] # Se activa al subir a estas ramas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construcción de imágenes usando tus carpetas reales
      - name: Build Back-Ventas
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/back-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push ${{ secrets.DOCKER_USERNAME }}/back-ventas:latest

      - name: Build Back-Despachos
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/back-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push ${{ secrets.DOCKER_USERNAME }}/back-despachos:latest

      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/front-web:latest ./front_despacho
          docker push ${{ secrets.DOCKER_USERNAME }}/front-web:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/proyecto-innovatech || mkdir ~/proyecto-innovatech && cd ~/proyecto-innovatech
            # Aquí necesitarás tener tu docker-compose.yml en la EC2
            docker-compose pull
            docker-compose up -d
            docker image prune -f